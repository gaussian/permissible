name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  pytest:
    name: Run pytest
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra guardian --group dev

      - name: Run tests
        run: uv run pytest
