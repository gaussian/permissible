name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: checks-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Ruff lint
        run: uv run --all-extras ruff check permissible/ tests/
      - name: Ruff format check
        run: uv run --all-extras ruff format --check permissible/ tests/

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: '3.12'
      - name: Run tests
        run: uv run --all-extras pytest
